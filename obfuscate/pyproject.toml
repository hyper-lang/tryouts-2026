[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obfuscate"
version = "0.1.0"
description = "Apollo WinExe hardening and in-process runtime defense-bypass tooling"
requires-python = ">=3.12"
dependencies = [
    "dnfile==0.18.0",
]

[project.scripts]
obfuscate = "obfuscate.cli:main"

[tool.setuptools]
packages = ["obfuscate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
